const { useState, useEffect, useRef, useCallback, useMemo } = React;

// hex (#rrggbb) -> "r,g,b"
function hexToRGB(hex){
  const h = (hex||"#FFB43C").replace("#","");
  const n = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  const r = parseInt(n.slice(0,2),16), g = parseInt(n.slice(2,4),16), b = parseInt(n.slice(4,6),16);
  return `${r},${g},${b}`;
}

const buildTheme = (accentHex) => {
  const rgb = hexToRGB(accentHex);
  return {
    bg:"oklch(11% 0.018 240)", bgAlt:"oklch(15% 0.022 240)",
    bgCard:"oklch(14.5% 0.02 240)", bgHov:"oklch(17% 0.024 240)",
    border:"oklch(21% 0.025 240)",
    accent:accentHex, accentT:accentHex,
    accentS:`rgba(${rgb},0.12)`, accentG:`rgba(${rgb},0.22)`,
    col:`rgba(${rgb}`,
    tp:"oklch(94% 0.007 75)", ts:"oklch(67% 0.01 240)", td:"oklch(62% 0.01 240)",
    fD:"'Space Grotesk',system-ui,sans-serif",
    fB:"'Space Grotesk',system-ui,sans-serif",
    fM:"'IBM Plex Mono',monospace",
    r:"6px",
  };
};

let T = {
  bg:"oklch(11% 0.018 240)", bgAlt:"oklch(15% 0.022 240)",
  bgCard:"oklch(14.5% 0.02 240)", bgHov:"oklch(17% 0.024 240)",
  border:"oklch(21% 0.025 240)",
  accent:"oklch(75% 0.16 75)", accentT:"oklch(75% 0.16 75)",
  accentS:"rgba(255,180,60,0.12)", accentG:"rgba(255,180,60,0.22)",
  col:"rgba(255,175,50",
  tp:"oklch(94% 0.007 75)", ts:"oklch(67% 0.01 240)", td:"oklch(62% 0.01 240)",
  fD:"'Space Grotesk',system-ui,sans-serif",
  fB:"'Space Grotesk',system-ui,sans-serif",
  fM:"'IBM Plex Mono',monospace",
  r:"6px",
};

// ══ CANVASES ════════════════════════════════════════════════════

function NeuralCanvas({ cfg={} }) {
  const ref = useRef(null);
  const { N=55, maxD=165, nOp=0.78, lOp=0.3, spd=0.3 } = cfg;
  useEffect(() => {
    const c = ref.current; if (!c) return;
    let id, fr=0;
    const rs = () => { c.width=c.offsetWidth; c.height=c.offsetHeight; };
    rs(); window.addEventListener("resize",rs);
    const ctx = c.getContext("2d"), col = T.col;
    const nodes = Array.from({length:N},()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*spd,vy:(Math.random()-.5)*spd,r:Math.random()*1.9+.7,p:Math.random()*Math.PI*2}));
    const draw = () => {
      ctx.clearRect(0,0,c.width,c.height); fr++;
      for(let i=0;i<N;i++){
        for(let j=i+1;j<N;j++){
          const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);
          if(d<maxD){ctx.strokeStyle=`${col},${lOp*(1-d/maxD)})`;ctx.lineWidth=.75;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();}
        }
        const n=nodes[i], p=.5+.5*Math.sin(n.p+fr*.018);
        ctx.fillStyle=`${col},${nOp*(.8+p*.4)})`;ctx.beginPath();ctx.arc(n.x,n.y,n.r*(.85+p*.32),0,Math.PI*2);ctx.fill();
        n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>c.width)n.vx*=-1;if(n.y<0||n.y>c.height)n.vy*=-1;
      }
      id=requestAnimationFrame(draw);
    };
    draw(); return()=>{cancelAnimationFrame(id);window.removeEventListener("resize",rs);};
  },[N,maxD]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}></canvas>;
}

function SolarCanvas() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    let id;
    const rs = () => { c.width=c.offsetWidth; c.height=c.offsetHeight; };
    rs(); window.addEventListener("resize",rs);
    const ctx = c.getContext("2d"), col = T.col;
    const orbits=[
      {rX:72,rY:24,spd:.013,a:0.0,sz:3.2,op:.9,trail:[]},
      {rX:115,rY:38,spd:.0075,a:2.1,sz:4.5,op:.75,trail:[]},
      {rX:162,rY:54,spd:.0047,a:4.3,sz:3.0,op:.6,trail:[]},
      {rX:210,rY:70,spd:.0028,a:1.5,sz:2.5,op:.45,trail:[]},
    ];
    const draw = () => {
      ctx.clearRect(0,0,c.width,c.height);
      const sx=c.width*.78, sy=c.height*.5;
      // Orbit rings
      orbits.forEach(o=>{
        ctx.strokeStyle=`${col},0.1)`;ctx.lineWidth=.6;
        ctx.beginPath();ctx.ellipse(sx,sy,o.rX,o.rY,0,0,Math.PI*2);ctx.stroke();
      });
      // Sun multi-layer glow
      [[32,.2],[20,.38],[10,.62],[4,.95]].forEach(([r,op])=>{
        const g=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
        g.addColorStop(0,`${col},${op})`);g.addColorStop(1,`${col},0)`);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fill();
      });
      // Planets + trails
      orbits.forEach(o=>{
        o.a+=o.spd;
        const px=sx+Math.cos(o.a)*o.rX, py=sy+Math.sin(o.a)*o.rY;
        o.trail.push({x:px,y:py}); if(o.trail.length>22) o.trail.shift();
        // Trail
        o.trail.forEach((pt,i)=>{
          ctx.fillStyle=`${col},${(i/o.trail.length)*o.op*0.4})`;
          ctx.beginPath();ctx.arc(pt.x,pt.y,o.sz*.35,0,Math.PI*2);ctx.fill();
        });
        // Planet glow halo
        const pg=ctx.createRadialGradient(px,py,0,px,py,o.sz*2.8);
        pg.addColorStop(0,`${col},${o.op})`);pg.addColorStop(1,`${col},0)`);
        ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,o.sz*2.8,0,Math.PI*2);ctx.fill();
        // Planet core
        ctx.fillStyle=`${col},${o.op})`;ctx.beginPath();ctx.arc(px,py,o.sz,0,Math.PI*2);ctx.fill();
      });
      id=requestAnimationFrame(draw);
    };
    draw(); return()=>{cancelAnimationFrame(id);window.removeEventListener("resize",rs);};
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}></canvas>;
}

function FourierCanvas() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    let id, fr=0;
    const rs = () => { c.width=c.offsetWidth; c.height=c.offsetHeight; };
    rs(); window.addEventListener("resize",rs);
    const ctx = c.getContext("2d"), col = T.col;
    const comps=[[.22,1,0],[.11,3,.6],[.07,5,1.1],[.045,7,1.7],[.03,9,2.3],[.022,11,3.0]];
    const draw = () => {
      ctx.clearRect(0,0,c.width,c.height); fr++;
      const W=c.width, H=c.height;
      // Subtle scope grid — centered
      ctx.setLineDash([3,10]); ctx.lineWidth=.5;
      for(let i=1;i<5;i++){
        ctx.strokeStyle=`${col},0.06)`;
        ctx.beginPath();ctx.moveTo(0,H*i/5);ctx.lineTo(W,H*i/5);ctx.stroke();
      }
      for(let i=1;i<7;i++){
        ctx.beginPath();ctx.moveTo(W*i/7,0);ctx.lineTo(W*i/7,H);ctx.stroke();
      }
      ctx.setLineDash([]);
      const baseY = H * .48; // centered vertically
      // Harmonics (faint, each offset slightly vertically)
      comps.slice(1).forEach((cm,i)=>{
        ctx.strokeStyle=`${col},${cm[0]*0.65})`;ctx.lineWidth=.7;
        ctx.beginPath();
        for(let x=0;x<=W;x+=2){
          const y=baseY - H*.28 + i*(H*.055) + Math.sin((x/W)*Math.PI*2*cm[1]+(fr*.013)+cm[2])*H*cm[0]*1.1;
          x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }ctx.stroke();
      });
      // Composite sum — bright, centered
      ctx.strokeStyle=`${col},0.5)`;ctx.lineWidth=1.8;
      ctx.beginPath();
      for(let x=0;x<=W;x+=2){
        let y=0;comps.forEach(cm=>y+=Math.sin((x/W)*Math.PI*2*cm[1]+(fr*.013)+cm[2])*H*cm[0]*.52);
        x===0?ctx.moveTo(x,baseY+y):ctx.lineTo(x,baseY+y);
      }ctx.stroke();
      // Glow pass
      ctx.strokeStyle=`${col},0.14)`;ctx.lineWidth=5;
      ctx.beginPath();
      for(let x=0;x<=W;x+=3){
        let y=0;comps.forEach(cm=>y+=Math.sin((x/W)*Math.PI*2*cm[1]+(fr*.013)+cm[2])*H*cm[0]*.52);
        x===0?ctx.moveTo(x,baseY+y):ctx.lineTo(x,baseY+y);
      }ctx.stroke();
      // Moving scope cursor
      const curX=(fr*1.1)%W;
      ctx.strokeStyle=`${col},0.22)`;ctx.lineWidth=1;ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(curX,0);ctx.lineTo(curX,H);ctx.stroke();
      id=requestAnimationFrame(draw);
    };
    draw(); return()=>{cancelAnimationFrame(id);window.removeEventListener("resize",rs);};
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}></canvas>;
}

// ── Pulse / circuit traces for Education ──────────────────────
function PulseCanvas() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    let id, fr=0;
    const rs = () => { c.width=c.offsetWidth; c.height=c.offsetHeight; };
    rs(); window.addEventListener("resize",rs);
    const ctx = c.getContext("2d"), col = T.col;
    const makeTraces = () => {
      const H=c.height, W=c.width, rows=5;
      return Array.from({length:rows},(_, i)=>{
        const y=H*(.15+i*(0.7/(rows-1)));
        const segs=[]; let x=0;
        while(x<W){const l=60+Math.random()*80;segs.push({x1:x,x2:Math.min(x+l,W),y});x+=l+Math.random()*30;}
        return {y,segs,jx:segs.slice(0,-1).map(s=>s.x2),pulses:[{x:Math.random()*W,spd:.6+Math.random()*.7},{x:Math.random()*W*.5,spd:.4+Math.random()*.5}]};
      });
    };
    let traces=makeTraces();
    const draw = () => {
      ctx.clearRect(0,0,c.width,c.height); fr++;
      // Redraw on resize occasionally
      if(c.width!==c.offsetWidth||c.height!==c.offsetHeight){rs();traces=makeTraces();}
      traces.forEach(tr=>{
        tr.segs.forEach(s=>{
          ctx.strokeStyle=`${col},0.08)`;ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(s.x1,tr.y);ctx.lineTo(s.x2,tr.y);ctx.stroke();
        });
        // Junction pads
        tr.jx.forEach(jx=>{
          ctx.fillStyle=`${col},0.16)`;ctx.beginPath();ctx.arc(jx,tr.y,2.5,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle=`${col},0.08)`;ctx.lineWidth=.8;ctx.beginPath();ctx.arc(jx,tr.y,4.5,0,Math.PI*2);ctx.stroke();
        });
        // Moving pulses (glowing dot)
        tr.pulses.forEach(p=>{
          const g=ctx.createRadialGradient(p.x,tr.y,0,p.x,tr.y,7);
          g.addColorStop(0,`${col},.8)`);g.addColorStop(.5,`${col},.3)`);g.addColorStop(1,`${col},0)`);
          ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,tr.y,7,0,Math.PI*2);ctx.fill();
          p.x+=p.spd; if(p.x>c.width)p.x=-8;
        });
      });
      id=requestAnimationFrame(draw);
    };
    draw(); return()=>{cancelAnimationFrame(id);window.removeEventListener("resize",rs);};
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}></canvas>;
}

// ── Rocket Canvas ─────────────────────────────────────────────
function RocketCanvas() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    let id, fr=0;
    const rs = () => { c.width=c.offsetWidth; c.height=c.offsetHeight; };
    rs(); window.addEventListener("resize",rs);
    const ctx = c.getContext("2d"), col = T.col;
    // Multiple rockets at different positions/speeds
    const rockets = [
      {x:.15, y:1.1, spd:.0018, wobble:.0, sz:1.0, op:.7, particles:[]},
      {x:.55, y:1.3, spd:.0013, wobble:.5, sz:.75, op:.5, particles:[]},
      {x:.82, y:1.5, spd:.0009, wobble:1.2, sz:.6, op:.35, particles:[]},
    ];
    const drawRocket = (rx,ry,sz,op) => {
      ctx.save();
      ctx.translate(rx,ry);ctx.rotate(-Math.PI/2);ctx.scale(sz,sz);
      // Body
      ctx.fillStyle=`${col},${op})`;
      ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(5,8);ctx.lineTo(-5,8);ctx.closePath();ctx.fill();
      // Nose cone
      const ng=ctx.createLinearGradient(0,-14,0,-8);
      ng.addColorStop(0,`${col},${op})`);ng.addColorStop(1,`${col},${op*.6})`);
      ctx.fillStyle=ng;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(3,-6);ctx.lineTo(-3,-6);ctx.closePath();ctx.fill();
      // Fins
      ctx.fillStyle=`${col},${op*.8})`;
      ctx.beginPath();ctx.moveTo(4,6);ctx.lineTo(9,14);ctx.lineTo(5,8);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(-4,6);ctx.lineTo(-9,14);ctx.lineTo(-5,8);ctx.closePath();ctx.fill();
      // Window
      ctx.fillStyle=`${col},${op*.5})`;ctx.beginPath();ctx.arc(0,-2,2.5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    };
    const draw = () => {
      ctx.clearRect(0,0,c.width,c.height); fr++;
      const W=c.width, H=c.height;
      rockets.forEach(rk=>{
        rk.y-=rk.spd;
        if(rk.y<-0.2) rk.y=1.2;
        const wx=Math.sin(fr*.022+rk.wobble)*0.012;
        const rx=(rk.x+wx)*W, ry=rk.y*H;
        // Exhaust particles
        for(let i=0;i<2;i++){
          rk.particles.push({x:rx,y:ry,vx:(Math.random()-.5)*1.2,vy:2+Math.random()*2,life:1,sz:Math.random()*2+.5});
        }
        rk.particles=rk.particles.filter(p=>{
          p.x+=p.vx;p.y+=p.vy;p.life-=.04;
          if(p.life>0){
            ctx.fillStyle=`${col},${p.life*rk.op*0.7})`;
            ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
            return true;
          }
          return false;
        });
        // Exhaust glow
        const eg=ctx.createRadialGradient(rx,ry+12*rk.sz,0,rx,ry+12*rk.sz,14*rk.sz);
        eg.addColorStop(0,`${col},${rk.op*.6})`);eg.addColorStop(1,`${col},0)`);
        ctx.fillStyle=eg;ctx.beginPath();ctx.ellipse(rx,ry+12*rk.sz,5*rk.sz,12*rk.sz,0,0,Math.PI*2);ctx.fill();
        drawRocket(rx,ry,rk.sz,rk.op);
        // Streak trail
        ctx.strokeStyle=`${col},${rk.op*.22})`;ctx.lineWidth=rk.sz;
        ctx.beginPath();ctx.moveTo(rx,ry+10);ctx.lineTo(rx+(wx*W*.3),ry+55*rk.sz);ctx.stroke();
      });
      id=requestAnimationFrame(draw);
    };
    draw(); return()=>{cancelAnimationFrame(id);window.removeEventListener("resize",rs);};
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}></canvas>;
}

// ── Typewriter ─────────────────────────────────────────────────
function Typewriter({ text, speed=40, delay=800, style }) {
  const [d,setD]=useState('');const[done,setDone]=useState(false);
  useEffect(()=>{let i=0;const to=setTimeout(()=>{const iv=setInterval(()=>{i++;setD(text.slice(0,i));if(i>=text.length){clearInterval(iv);setTimeout(()=>setDone(true),2600);}},speed);return()=>clearInterval(iv);},delay);return()=>clearTimeout(to);},[]);
  return <span style={style}>{d}<span style={{animation:done?"none":"cursor-blink .7s ease-in-out infinite",opacity:done?0:1,transition:"opacity .5s ease"}}>_</span></span>;
}

    </section>
  );
}

// ── Education (Pulse) ──────────────────────────────────────────
function Education({ tw = {} }) {
  return(
    <section id="education" className="reveal" style={{position:"relative",overflow:"hidden",padding:"4rem 2rem",maxWidth:"960px",margin:"0 auto",borderTop:`1px solid ${T.border}`}}>
      {tw.educationAnim !== false && <PulseCanvas />}
      <div style={{position:"relative",zIndex:1}}>
        <SH title="Education" />
        <div style={{display:"flex",flexDirection:"column",gap:"2rem"}}>
          {EDU.map((item,i)=>(
            <div key={i} className="trow" style={{display:"grid",gridTemplateColumns:"155px 1fr",gap:"2.5rem"}}>
              <div style={{fontFamily:T.fM,fontSize:"0.76rem",color:T.td,fontWeight:700,paddingTop:"0.1rem"}}>{item.date}</div>
              <div>
                <div style={{fontFamily:T.fD,fontSize:"1rem",color:T.tp,fontWeight:600,marginBottom:"0.2rem"}}>{item.degree}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:"0.3rem",alignItems:"center"}}>
                  {item.sp.map((p,j)=>(
                    <React.Fragment key={j}>
                      {j>0&&<span style={{color:T.td,fontSize:"0.78rem",fontFamily:T.fB}}>·</span>}
                      <a href={p.h} target="_blank" rel="noreferrer"
                        style={{fontFamily:T.fB,fontSize:"0.86rem",color:T.ts,textDecoration:"none",borderBottom:`1px solid ${T.border}`,transition:"border-color .15s,color .15s"}}
                        onMouseEnter={e=>{e.currentTarget.style.borderBottomColor=T.accent;e.currentTarget.style.color=T.accentT;}}
                        onMouseLeave={e=>{e.currentTarget.style.borderBottomColor=T.border;e.currentTarget.style.color=T.ts;}}
                      >{p.l}</a>
                    </React.Fragment>
                  ))}
                  <span style={{fontFamily:T.fB,fontSize:"0.86rem",color:T.td}}>· {item.loc}</span>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ── Skills (Neural bg) ─────────────────────────────────────────
function Skills({ tw = {} }) {
  return(
    <section id="skills" className="reveal" style={{position:"relative",overflow:"hidden",padding:"4rem 2rem",maxWidth:"960px",margin:"0 auto",borderTop:`1px solid ${T.border}`}}>
      {tw.skillsAnim !== false && <NeuralCanvas cfg={{N:30,maxD:130,nOp:.32,lOp:.1,spd:.15}} />}
      <div style={{position:"relative",zIndex:1}}>
        <SH title="Skills & Tools" />
        <div className="sgrid" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"2.5rem 2rem"}}>
          {SKILLS.map((cat,i)=>(
            <div key={i}>
              <div style={{fontFamily:T.fM,fontSize:"0.63rem",letterSpacing:"0.14em",textTransform:"uppercase",color:T.accent,fontWeight:500,marginBottom:"0.9rem"}}>{cat.cat}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:"0.38rem"}}>
                {cat.items.map((item,j)=>(
                  <span key={j} style={{fontFamily:T.fB,fontSize:"0.77rem",color:T.ts,padding:"0.22rem 0.58rem",border:`1px solid ${T.border}`,borderRadius:"999px",background:T.bgCard,transition:"all .18s",cursor:"default"}}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor=T.accent;e.currentTarget.style.color=T.accentT;e.currentTarget.style.background=T.accentS;e.currentTarget.style.boxShadow=`0 0 10px ${T.accentG}`;}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.ts;e.currentTarget.style.background=T.bgCard;e.currentTarget.style.boxShadow="none";}}
                  >{item}</span>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ── Footer ─────────────────────────────────────────────────────
function Footer() {
  return(
    <footer style={{padding:"3rem 2rem",borderTop:`1px solid ${T.border}`,maxWidth:"960px",margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"1rem"}}>
      <span style={{fontFamily:T.fM,fontSize:"0.72rem",color:T.td}}><span style={{color:T.accent}}>&gt;</span> Gentjan Gjinalaj · 2026</span>
      <div style={{display:"flex",gap:"1.5rem",flexWrap:"wrap"}}>
        {["gentjan.gjinalaj@savoye.com","gentjan.gjinalaj@univ-grenoble-alpes.fr"].map(e=>(
          <a key={e} href={`mailto:${e}`} style={{fontFamily:T.fB,fontSize:"0.72rem",color:T.td,textDecoration:"none",transition:"color .15s"}}
            onMouseEnter={ev=>ev.currentTarget.style.color=T.accentT}
            onMouseLeave={ev=>ev.currentTarget.style.color=T.td}
          >{e}</a>
        ))}
      </div>
    </footer>
  );
}

// ── App ────────────────────────────────────────────────────────
function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  // Recompute theme when accent changes
  T = useMemo(() => buildTheme(tw.accent), [tw.accent]);
  useReveal();
  useEffect(()=>{
    document.body.style.background=T.bg;
    document.documentElement.style.setProperty('--acc', T.accent);
    document.documentElement.style.setProperty('--acc-glow', T.accentG);
    document.documentElement.style.setProperty('--acc-soft', T.accentS);
  },[tw.accent]);
  return(
    <div key={tw.accent} style={{minHeight:"100vh",background:T.bg}}>
      <Nav/>
      <Hero tw={tw}/>
      <About tw={tw}/>
      <Current/>
      <Research/>
      <Experience tw={tw}/>
      <Education tw={tw}/>
      <Skills tw={tw}/>
      <Footer/>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakColor label="Accent" value={tw.accent}
          options={["#FFB43C","#7AD0FF","#9D7BFF","#4ADE80","#FF6B9D","#F0F0F0"]}
          onChange={v=>setTweak('accent',v)} />
        <TweakSection label="Section animations" />
        <TweakToggle label="Hero neural net" value={tw.heroAnim} onChange={v=>setTweak('heroAnim',v)} />
        <TweakToggle label="About solar system" value={tw.aboutAnim} onChange={v=>setTweak('aboutAnim',v)} />
        <TweakToggle label="Experience fourier" value={tw.experienceAnim} onChange={v=>setTweak('experienceAnim',v)} />
        <TweakToggle label="Education pulse" value={tw.educationAnim} onChange={v=>setTweak('educationAnim',v)} />
        <TweakToggle label="Skills neural net" value={tw.skillsAnim} onChange={v=>setTweak('skillsAnim',v)} />
        <TweakSection label="Hero accents" />
        <TweakToggle label="Ambient glow" value={tw.ambientGlow} onChange={v=>setTweak('ambientGlow',v)} />
        <TweakToggle label="Scan line" value={tw.scanLine} onChange={v=>setTweak('scanLine',v)} />
        <TweakToggle label="Grid overlay" value={tw.gridOverlay} onChange={v=>setTweak('gridOverlay',v)} />
        <TweakToggle label="Photo glow pulse" value={tw.photoGlow} onChange={v=>setTweak('photoGlow',v)} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
